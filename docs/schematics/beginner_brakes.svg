<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="group" aria-label="Simple cause-and-effect diagram; select a part for its explanation" class="lr-story-svg"><style>.lr-story-box{fill:#fff;stroke:#b9d7c8;stroke-width:1.5}.lr-story-name{font-family:system-ui,sans-serif;font-weight:600;font-size:17px;fill:#315547}.lr-story-reading{font-family:system-ui,sans-serif;font-size:14px;fill:#5b7d65}.lr-story-measurement{font-family:monospace;font-size:12px;fill:#7c9580}.lr-story-node.lr-picked .lr-story-box{stroke:#297f63;stroke-width:2.5;fill:#f2faed}.lr-story-node.lr-warning .lr-story-box{fill:#fff8eb;stroke:#dcaa69}.lr-story-node.lr-warning .lr-story-reading{fill:#a26c2e}</style><defs><marker id="lr-story-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b9086"/></marker></defs><path d="M 300 74 H 380" fill="none" stroke="#81a99f" stroke-width="3" marker-end="url(#lr-story-arrow)"/><path d="M 520 132 V 188" fill="none" stroke="#81a99f" stroke-width="3" marker-end="url(#lr-story-arrow)"/><path d="M 380 246 H 300" fill="none" stroke="#81a99f" stroke-width="3" marker-end="url(#lr-story-arrow)"/><path d="M 160 188 V 132" fill="none" stroke="#81a99f" stroke-width="3" marker-end="url(#lr-story-arrow)"/><g transform="translate(20 20)" tabindex="0" role="button" class="lr-story-node lr-picked" aria-label="Explain The moving vehicle"><rect x="0" y="0" width="280" height="112" rx="12" class="lr-story-box"/><text x="18" y="28" class="lr-story-name">The moving vehicle</text><text x="18" y="58" class="lr-story-reading">Still moving</text><text x="18" y="86" class="lr-story-measurement">69.5 km/h</text></g><g transform="translate(380 20)" tabindex="0" role="button" class="lr-story-node" aria-label="Explain Wheel-speed sensor"><rect x="0" y="0" width="280" height="112" rx="12" class="lr-story-box"/><text x="18" y="28" class="lr-story-name">Wheel-speed sensor</text><text x="18" y="58" class="lr-story-reading">Wheel readings arriving</text><text x="18" y="86" class="lr-story-measurement">59.8 km/h</text></g><g transform="translate(380 188)" tabindex="0" role="button" class="lr-story-node" aria-label="Explain Brake computer"><rect x="0" y="0" width="280" height="112" rx="12" class="lr-story-box"/><text x="18" y="28" class="lr-story-name">Brake computer</text><text x="18" y="58" class="lr-story-reading">Adjusting wheel braking</text><text x="18" y="86" class="lr-story-measurement">Compares wheels with vehicle</text></g><g transform="translate(20 188)" tabindex="0" role="button" class="lr-story-node" aria-label="Explain Wheel response"><rect x="0" y="0" width="280" height="112" rx="12" class="lr-story-box"/><text x="18" y="28" class="lr-story-name">Wheel response</text><text x="18" y="58" class="lr-story-reading">Brake effort is adjusted</text><text x="18" y="86" class="lr-story-measurement">59.8 km/h</text></g></svg>